name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: spendwise_password
          POSTGRES_DB: spendwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://spendwise:spendwise_password@localhost:5432/spendwise_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run linter (ruff)
        run: |
          cd backend
          ruff check .

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://spendwise:spendwise_password@localhost:5432/spendwise_test
          JWT_SECRET: testsecret
        run: |
          cd backend
          pytest

  # Optional deploy job trigger for Render
  deploy-render:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        # TODO: Configure RENDER_DEPLOY_HOOK_URL in GitHub Repository Secrets once Render service is provisioned
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deploy hook."
          fi
