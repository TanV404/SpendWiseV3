services:
  postgres:
    image: postgres:15-alpine
    container_name: spendwise_postgres
    restart: always
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise_password
      POSTGRES_DB: spendwise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendwise_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://spendwise:spendwise_password@postgres:5432/spendwise
      JWT_SECRET: supersecretjwtkey_change_me_in_production_12345
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
